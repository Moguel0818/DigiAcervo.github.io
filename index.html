<style>
@font-face {
  font-family: "Archivo"; src: url("fonts/archivo-latin.woff2") format("woff2");
  font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Archivo"; src: url("fonts/archivo-latin-ext.woff2") format("woff2");
  font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Courier Prime"; src: url("fonts/courier-prime-400.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: "Courier Prime"; src: url("fonts/courier-prime-ext-400.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Courier Prime"; src: url("fonts/courier-prime-700.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+FEFF, U+FFFD;
}

:root {
  /* Layout: uma coluna tipo livro de tombo. Cabeçalho escuro como a etiqueta de uma caixa de arquivo,
     a lista de digitalizações abaixo e folhas que sobem para busca, edição e ajustes. */
  --ground: #EDF0F2;
  --surface: #FFFFFF;
  --surface-2: #F4F6F8;
  --ink: #141B20;
  --ink-2: #3F4C56;
  --ink-3: #5E6B75;
  --rule: #D4DBE0;
  --accent: #245A86;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9E6F1;
  --label: #1C2A35;
  --label-ink: #F1F4F6;
  --label-ink-2: #9DB0BE;
  --label-hover: rgb(255 255 255 / .1);
  --redline: #D2433A;
  --st-fila: #56636E;       --st-fila-bg: #E1E6EA;
  --st-andamento: #8A5600;  --st-andamento-bg: #F6E5C3;
  --st-concluido: #1D6B43;  --st-concluido-bg: #D3EBDC;
  --st-refazer: #A3294A;    --st-refazer-bg: #F4D9E0;
  --ph-s: 24%; --ph-l: 84%; --ph-ink-l: 30%;
  --shadow-1: 0 1px 2px rgb(20 27 32 / .08);
  --shadow-2: 0 12px 32px rgb(20 27 32 / .18);
  --backdrop: rgb(14 20 25 / .5);
  --font-display: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Courier Prime", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0E1317;
    --surface: #161D23;
    --surface-2: #1B242B;
    --ink: #E2E8EB;
    --ink-2: #A8B4BD;
    --ink-3: #7C8A94;
    --rule: #28323B;
    --accent: #8DB8DD;
    --accent-ink: #0E1317;
    --accent-soft: #1C3246;
    --label: #141C23;
    --label-ink: #EEF2F4;
    --label-ink-2: #8B9BA8;
    --label-hover: rgb(255 255 255 / .08);
    --redline: #E3584E;
    --st-fila: #A4B0BA;       --st-fila-bg: #232C34;
    --st-andamento: #E9B964;  --st-andamento-bg: #382A10;
    --st-concluido: #70CC99;  --st-concluido-bg: #132E21;
    --st-refazer: #F18BA2;    --st-refazer-bg: #3B1924;
    --ph-s: 16%; --ph-l: 24%; --ph-ink-l: 78%;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .45);
    --shadow-2: 0 14px 36px rgb(0 0 0 / .55);
    --backdrop: rgb(0 0 0 / .62);
    color-scheme: dark;
  }
}
.st-fila { --sc: var(--st-fila); --sb: var(--st-fila-bg); }
.st-andamento { --sc: var(--st-andamento); --sb: var(--st-andamento-bg); }
.st-concluido { --sc: var(--st-concluido); --sb: var(--st-concluido-bg); }
.st-refazer { --sc: var(--st-refazer); --sb: var(--st-refazer-bg); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--ground); color: var(--ink);
  font: 400 15px/1.45 var(--font-ui); font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
[hidden] { display: none !important; }
img { max-width: 100%; display: block; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
svg { flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 980px; margin-inline: auto; }
.gutter { padding-left: var(--gl); padding-right: var(--gr); }
.mono { font-family: var(--font-mono); }

/* Cabeçalho: etiqueta da caixa, com a linha vermelha da ficha catalográfica */
.top {
  position: sticky; top: 0; z-index: 30;
  background: var(--label); color: var(--label-ink);
  padding-top: env(safe-area-inset-top, 0px);
  border-bottom: 3px solid var(--redline);
}
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.wordmark {
  margin: 0; font-family: var(--font-display); font-weight: 850; font-stretch: 125%;
  font-size: 1.45rem; line-height: 1; letter-spacing: .07em; text-transform: uppercase;
}
.brand-sub {
  font-family: var(--font-mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--label-ink-2); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 0; padding: 0;
  background: transparent; color: inherit; display: inline-grid; place-items: center; flex: none;
}
.top .icon-btn:hover { background: var(--label-hover); }
.icon-btn.bordered { border: 1px solid var(--rule); background: var(--surface); height: 44px; width: 44px; }

/* Resumo por status */
.summary { padding-block: 16px 4px; }
.bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule); }
.bar span { flex: 1 1 0; min-width: 3px; background: var(--sc); }
.legend { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 0 -8px; }
.legend button {
  display: inline-flex; align-items: baseline; gap: 6px; min-height: 34px;
  border: 1px solid transparent; border-radius: 999px; background: transparent;
  padding: 4px 11px 4px 9px; color: var(--ink-2); font-size: .88rem;
}
.legend button:hover { background: var(--surface); }
.legend button[aria-pressed="true"] { background: var(--surface); border-color: var(--sc); color: var(--ink); }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); align-self: center; }
.legend .n {
  font-family: var(--font-display); font-weight: 760; font-stretch: 112%;
  font-size: 1.02rem; color: var(--ink); font-variant-numeric: tabular-nums;
}

/* Controles */
.controls { display: grid; gap: 10px; padding-block: 10px 6px; }
.searchbox { position: relative; display: block; }
.searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.searchbox input { padding-left: 40px; }
.inp {
  width: 100%; min-height: 44px; border-radius: 9px; border: 1px solid var(--rule);
  background: var(--surface); padding: 10px 12px; font-size: 16px; line-height: 1.3;
  -webkit-appearance: none; appearance: none;
}
.inp::placeholder { color: var(--ink-3); opacity: .85; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { min-height: 92px; resize: vertical; }
input[type="date"].inp { min-width: 0; }
.selwrap { position: relative; display: block; min-width: 0; }
.selwrap select { padding-right: 34px; cursor: pointer; }
.selwrap svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-3); }
.chiprow {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr));
  padding: 2px var(--gr) 2px var(--gl);
}
.chiprow::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--surface);
  color: var(--ink-2); font-size: .88rem; font-weight: 520; white-space: nowrap; user-select: none;
}
.chip .c { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.chip[aria-pressed="true"] .c { color: inherit; opacity: .75; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sort { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--ink-2); min-width: 0; }
.sort .inp { min-height: 36px; padding-block: 6px; width: auto; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); flex: none; }
.seg button { width: 42px; height: 34px; border: 0; background: transparent; color: var(--ink-3); display: grid; place-items: center; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }

/* Lista */
.listwrap { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
#items.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start;
  width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--rule);
  background: transparent; text-align: left; color: inherit;
  content-visibility: auto; contain-intrinsic-size: auto 89px;
}
.row:hover .row-title { color: var(--accent); }
.row-main { min-width: 0; display: grid; gap: 2px; }
.row-title { font-weight: 650; font-size: 1rem; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { color: var(--ink-2); font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub .mono { font-size: .84rem; color: var(--ink-3); }
.row-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mtag {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px;
  font-family: var(--font-mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .03em;
  border: 1px solid var(--rule); border-radius: 4px; color: var(--ink-2); background: var(--surface); white-space: nowrap;
}
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px;
  font-size: .78rem; font-weight: 620; background: var(--sb); color: var(--sc); white-space: nowrap;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.date { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

#items.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 12px; padding-top: 10px; }
@media (min-width: 720px) { #items.grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; } }
.card { display: grid; align-content: start; gap: 6px; padding: 0; border: 0; background: transparent; color: inherit; text-align: left; min-width: 0; }
.card .cover { box-shadow: var(--shadow-1); }
.card:hover .card-title { color: var(--accent); }
.card-title { font-size: .86rem; font-weight: 650; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card-artist { font-size: .8rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cover .over { position: absolute; left: 5px; bottom: 5px; font-size: .68rem; padding: 0 5px; }
.sdot { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 2px var(--surface); }

/* Capas */
.cover {
  position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 1;
  border-radius: 4px; overflow: hidden; background: var(--surface-2); container-type: inline-size;
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
.ph {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: hsl(var(--h, 210) var(--ph-s) var(--ph-l)); color: hsl(var(--h, 210) 32% var(--ph-ink-l));
}
.ph b { font-family: var(--font-display); font-stretch: 125%; font-weight: 820; font-size: 1rem; font-size: 28cqw; letter-spacing: .02em; line-height: 1; }
.ph svg { position: absolute; right: 7%; bottom: 7%; width: 26%; height: 26%; opacity: .5; }

/* Estado vazio e avisos */
.empty { display: grid; gap: 16px; max-width: 560px; padding-block: 28px 8px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-stretch: 112%; font-weight: 780; font-size: 1.45rem; line-height: 1.15; text-wrap: balance; }
.empty > p { color: var(--ink-2); max-width: 52ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: passo; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; color: var(--ink-2); }
.steps li strong { color: var(--ink); }
.steps li::before {
  counter-increment: passo; content: counter(passo);
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
}
.steps li.done::before { content: "✓"; background: var(--st-concluido-bg); color: var(--st-concluido); border-color: transparent; }
.noresults { padding-block: 28px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.note {
  display: grid; gap: 8px; padding: 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); font-size: .92rem;
}
.note strong { color: var(--ink); }
.note.warn { background: var(--st-andamento-bg); border-color: transparent; color: var(--st-andamento); }
.note.warn strong { color: inherit; }
.nudge { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.nudge p { flex: 1 1 220px; }
.fine { font-size: .84rem; color: var(--ink-3); }
.hint { font-size: .88rem; color: var(--ink-2); }
.msg { font-size: .9rem; color: var(--ink-2); }
.err { font-size: .86rem; color: var(--st-refazer); font-weight: 600; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font-weight: 620; font-size: .95rem; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
.btn-danger { color: var(--st-refazer); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; filter: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.fab {
  position: fixed; z-index: 25;
  right: var(--gr); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 22px 0 18px;
  border: 0; border-radius: 27px; background: var(--accent); color: var(--accent-ink);
  font-weight: 680; font-size: 1rem; box-shadow: var(--shadow-2);
}

/* Folha (busca, edição, ajustes) */
.backdrop {
  position: fixed; inset: 0; z-index: 50; background: var(--backdrop);
  display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out;
}
.sheet {
  width: 100%; max-width: 680px;
  height: calc(100vh - env(safe-area-inset-top, 0px) - 10px);
  height: calc(100dvh - env(safe-area-inset-top, 0px) - 10px);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--ground); border-radius: 18px 18px 0 0; box-shadow: var(--shadow-2);
  animation: rise .24s cubic-bezier(.2, .8, .2, 1);
}
.sheet:focus { outline: none; }
.sheet-head {
  display: flex; align-items: center; gap: 4px; min-height: 58px;
  padding: 8px calc(var(--gr) - 8px) 8px calc(var(--gl) - 8px);
  background: var(--surface); border-bottom: 1px solid var(--rule);
}
.sheet-head h2 {
  flex: 1; min-width: 0; margin: 0 0 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display); font-stretch: 110%; font-weight: 760; font-size: 1.1rem;
}
.sheet-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  display: grid; align-content: start; gap: 20px;
  padding: 18px var(--gr) 28px var(--gl);
}
.sheet-foot {
  display: flex; gap: 10px; padding: 12px var(--gr) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gl);
  background: var(--surface); border-top: 1px solid var(--rule);
}
.sheet-foot:empty { display: none; }
@media (min-width: 720px) {
  .backdrop { align-items: center; padding: 24px; }
  .sheet { height: auto; max-height: min(900px, calc(100vh - 48px)); border-radius: 18px; }
  .sheet-foot { padding-bottom: 12px; }
}
@keyframes rise { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Formulários */
.field { display: grid; gap: 7px; min-width: 0; }
.lbl {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: .74rem; font-weight: 680; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2);
}
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.inline-form { display: flex; gap: 8px; align-items: stretch; }
.inline-form > .inp { flex: 1; min-width: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { position: relative; display: inline-flex; }
.choice input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.choice span {
  display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--surface);

const DB = {
  db: null,
  mem: null,
  async open() {
    if (!('indexedDB' in window)) { this.mem = new Map(); return; }
    try {
      this.db = await new Promise((resolve, reject) => {
        const r = indexedDB.open('acervo', 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
        };
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.onblocked = () => reject(new Error('blocked'));
      });
    } catch (e) {
      this.mem = new Map();
    }
  },
  store(mode) { return this.db.transaction('items', mode).objectStore('items'); },
  wrap(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); },
  async all() { return this.mem ? [...this.mem.values()] : this.wrap(this.store('readonly').getAll()); },
  async put(item) { if (this.mem) { this.mem.set(item.id, item); return; } return this.wrap(this.store('readwrite').put(item)); },
  async del(id) { if (this.mem) { this.mem.delete(id); return; } return this.wrap(this.store('readwrite').delete(id)); },
  async putMany(items) {
    if (this.mem) { items.forEach(i => this.mem.set(i.id, i)); return; }
    await new Promise((resolve, reject) => {
      const tx = this.db.transaction('items', 'readwrite');
      const st = tx.objectStore('items');
      items.forEach(i => st.put(i));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },
};

function normalizeItem(r) {

document.addEventListener('securitypolicyviolation', e => {
  if (e.violatedDirective && e.violatedDirective.startsWith('connect-src') && /discogs\.com/.test(e.blockedURI || '')) DG.blocked = true;

function cleanToken(t) {
  return String(t || '').replace(/^\s*(authorization:\s*)?(discogs\s+)?token\s*=\s*/i, '').replace(/["'\s]/g, '');

const DG = {
  base: 'https://api.discogs.com',
  get token() { return cleanToken(store.get('dg_token')); },
  degraded: false,
  blocked: false, // a página hospedeira proíbe conexões externas (CSP connect-src)
  setToken(t) { store.set('dg_token', cleanToken(t) || null); },
  async req(path, params = {}, { signal } = {}) {
    if (navigator.onLine === false) throw { code: 'offline' };
    const tok = this.token;
    const pref = store.get('dg_mode') === 'query' ? 'query' : 'header';
    // Token inválido: o Discogs responde 401 sem cabeçalho CORS e o navegador mostra só "falha de rede".
    // Por isso, se as duas formas com token falharem, a última tentativa é sem token (a busca pública funciona).
    const modes = tok ? [pref, pref === 'header' ? 'query' : 'header', 'none'] : ['none'];
    this.degraded = false;
    let lastErr = { code: 'network' };
    for (const mode of modes) {
      const url = new URL(this.base + path);
      for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
      const init = { signal, headers: {} };
      if (mode === 'header') init.headers.Authorization = 'Discogs token=' + tok;
      if (mode === 'query') url.searchParams.set('token', tok);
      let res;
      try {
        res = await fetch(url.toString(), init);
      } catch (e) {
        if (e && e.name === 'AbortError') throw e;
        lastErr = { code: 'network' };
        continue; // falha de rede ou CORS: tenta a outra forma de enviar o token
      }
      if (mode !== 'none' && mode !== pref) store.set('dg_mode', mode);
      if (mode === 'none' && tok) this.degraded = true;
      if (res.ok) return res.json();
      if (res.status === 401) throw { code: 'auth', status: 401 };
      if (res.status === 404) throw { code: 'notfound', status: 404 };
      if (res.status === 429) throw { code: 'rate', status: 429 };
      throw { code: 'http', status: res.status };
    }
    throw lastErr;
  },
  search(params, signal) { return this.req('/database/search', params, { signal }); },
  async release(id) {
    const r = await this.req(`/releases/${id}`);
    const fm = Array.isArray(r.formats) ? r.formats : [];
    const imgs = Array.isArray(r.images) ? r.images : [];
    const img = imgs.find(i => i.type === 'primary') || imgs[0] || {};
    const lab = (Array.isArray(r.labels) && r.labels[0]) || {};
    const main = fm.find(f => DG_FORMAT[f.name]);
    const medium = main ? DG_FORMAT[main.name] : '';
    const descs = main ? [...(main.descriptions || []), ...String(main.text || '').split(',').map(x => x.trim())] : [];
    return {
      title: r.title || '',
      artist: joinArtists(r.artists) || cleanName(r.artists_sort),
      year: r.year || null,
      country: r.country || '',
      label: cleanName(lab.name || ''),
      catno: lab.catno && String(lab.catno).toLowerCase() !== 'none' ? String(lab.catno) : '',

      thumb: goodImg(img.uri150 || r.thumb),

  },
  async master(id) {

    const img = imgs.find(i => i.type === 'primary') || imgs[0] || {};

function fullUrl(uri, type, id) {
  if (typeof uri === 'string' && /^https:\/\/(www\.)?discogs\.com\//.test(uri)) return uri;
  if (typeof uri === 'string' && uri.startsWith('/')) return 'https://www.discogs.com' + uri;
  return `https://www.discogs.com/${type}/${id}`;
}
function joinArtists(arr) {
  if (!Array.isArray(arr) || !arr.length) return '';
  let out = '';
  arr.forEach((a, i) => {
    out += cleanName(a.anv || a.name);
    if (i < arr.length - 1) { const j = String(a.join || ',').trim() || ','; out += j === ',' ? ', ' : ` ${j} `; }
  });
  return out.replace(/\s+/g, ' ').trim();
}
function formatTextFrom(fm) {
  return fm.map(f => [(+f.qty > 1 ? `${f.qty}× ` : '') + f.name, ...(f.descriptions || []), f.text].filter(Boolean).join(', ')).join(' + ');
}
function detailFor(name, descs, medium) {
  const d = (descs || []).map(x => String(x).trim()).filter(Boolean);
  if (medium === 'vinil') {
    const kind = d.find(x => /^(LP|EP|Single|Maxi-Single|Mini-Album)$/i.test(x));
    const size = d.find(x => /^\d+(\.\d+)?"$/.test(x));
    const rpm = d.find(x => /RPM$/i.test(x));
    let out = [kind, size, rpm && rpm.replace(/33\s*⅓/, '33⅓')].filter(Boolean).join(' ');
    if (name === 'Shellac') out = (out ? out + ' · ' : '') + 'goma-laca';
    return out;
  }
  if (medium === 'cd') {
    if (name === 'CDr') return 'CD-R';
    if (name === 'SACD' || name === 'Hybrid') return 'SACD';
    if (d.includes('HDCD') || name === 'HDCD') return 'HDCD';
    return '';
  }
  if (medium === 'dvd' || medium === 'vhs' || medium === 'bluray') {
    const sys = d.find(x => /^(NTSC|PAL|PAL-M|SECAM)$/i.test(x));
    return sys || (name === 'DVDr' ? 'DVD-R' : '');
  }
  if (medium === 'outro') {
    return ({ Laserdisc: 'LaserDisc', Minidisc: 'MiniDisc', DAT: 'DAT', 'Reel-To-Reel': 'Rolo (open reel)', Betamax: 'Betamax', '8-Track Cartridge': 'Cartucho 8-track' })[name] || name || '';
  }
  return '';
}
function fromFormatList(list) {
  const arr = (list || []).map(x => String(x).trim()).filter(Boolean);
  const name = arr.find(x => DG_FORMAT[x]);
  const medium = name ? DG_FORMAT[name] : '';
  return { medium, detail: medium ? detailFor(name, arr.filter(x => !DG_FORMAT[x]), medium) : '' };
}
function normResult(r) {
  const raw = String(r.title || '');
  const cut = raw.indexOf(' - ');
  const fmts = Array.isArray(r.format) ? r.format : [];
  const inf = fromFormatList(fmts);
  return {
    type: r.type === 'master' ? 'master' : 'release',
    id: r.id,
    masterId: r.type === 'master' ? r.id : (r.master_id || null),
    title: cut > 0 ? raw.slice(cut + 3).trim() : raw.trim(),
    artist: cut > 0 ? cleanName(raw.slice(0, cut)) : '',
    year: parseInt(r.year, 10) || null,
    country: r.country || '',
    label: cleanName((Array.isArray(r.label) && r.label[0]) || ''),
    catno: r.catno && String(r.catno).toLowerCase() !== 'none' ? String(r.catno) : '',
    formatText: uniq(fmts).join(', '),
    medium: inf.medium,
    detail: inf.detail,
    thumb: goodImg(r.thumb),
    cover: goodImg(r.cover_image),
    url: fullUrl(r.uri, r.type === 'master' ? 'master' : 'release', r.id),

}
function parseQuery(q) {
  const s = q.trim();
  let m = s.match(/discogs\.com\/(?:[a-z]{2}(?:_[a-z]{2})?\/)?(?:[^\/?#\s]+\/)?(release|master)\/(\d+)/i);
  if (m) return { kind: 'url', type: m[1].toLowerCase(), id: +m[2] };
  m = s.match(/^\[?([rm])(\d+)\]?$/i);
  if (m) return { kind: 'url', type: m[1].toLowerCase() === 'r' ? 'release' : 'master', id: +m[2] };

  if (/^\d{8,14}$/.test(digits)) return { kind: 'barcode', value: digits };

function errText(e) {
  switch (e && e.code) {
    case 'notoken': return 'Para buscar por nome ou código de barras, salve seu token do Discogs. Links do Discogs funcionam sem token.';
    case 'auth': return 'O Discogs recusou o token salvo. Gere um novo em Discogs → Configurações → Desenvolvedores e cole em Ajustes.';
    case 'rate': return 'Muitas buscas em pouco tempo. Espere alguns segundos e tente de novo.';
    case 'notfound': return 'Esse item não existe no Discogs (ou foi removido).';
    case 'offline': return 'Sem internet agora. O acervo continua disponível; a busca volta com a conexão.';
    case 'network': return DG.blocked
      ? 'Este endereço bloqueia conexões com outros sites (é o caso do Neocities), então o app não consegue chegar ao Discogs. Hospede o app no GitHub Pages, no Netlify ou no Cloudflare Pages.'
      : 'Não consegui falar com o Discogs. Confira a conexão e tente de novo.';
    case 'http': return `O Discogs respondeu com erro ${e.status}. Tente de novo em instantes.`;
    default: return 'Algo deu errado ao falar com o Discogs. Tente de novo.';
  }
}
async function testToken(t) {
  const prev = DG.token;
  DG.setToken(t);
  try {
    const me = await DG.req('/oauth/identity');
    store.set('dg_user', me && me.username);
    render();
    return { ok: true, message: me && me.username ? `Conectado como @${me.username}.` : 'Token aceito pelo Discogs.' };
  } catch (e) {
    if (e && e.code === 'auth') {
      DG.setToken(prev);
      return { ok: false, message: 'O Discogs não aceitou esse token. Confira se copiou o código inteiro (só o token, sem espaços) ou gere um novo.' };
    }
    store.set('dg_user', null);
    render();
    return { ok: true, message: 'Token salvo, mas não deu para testar agora. ' + errText(e) };
  }
}

const hayCache = new WeakMap();

function history(key, medium) {

    counts.set(v, (counts.get(v) || 0) + 1);

function sortItems(arr) {

    artist: (a, b) => collator.compare(art(a), art(b)) || collator.compare(a.title, b.title) || (a.year || 0) - (b.year || 0),

/* ================= Folha (sheet) ================= */
const Sheet = {
  stack: [],
  lastFocus: null,
  get top() { return this.stack[this.stack.length - 1]; },
  get isOpen() { return !$('#sheet').hidden; },
  show(view) {
    if (!this.isOpen) this.lastFocus = document.activeElement;
    this.stack = [view];
    $('#sheet').hidden = false;
    document.body.classList.add('locked');
    this.paint(true);
  },
  push(view) { this.saveScroll(); this.stack.push(view); this.paint(true); },
  replace(view) { this.stack[this.stack.length - 1] = view; this.paint(true); },
  rerender() { this.saveScroll(); this.paint(false); },
  back() {
    if (this.stack.length <= 1) return this.requestClose();
    const top = this.top;
    if (top.dirty && !confirm('Descartar o que você preencheu?')) return;
    this.stack.pop();
    this.paint(false);
  },
  requestClose() {
    if (this.stack.some(v => v.dirty) && !confirm('Descartar o que você preencheu?')) return;
    this.close();
  },
  close() {
    this.stack = [];
    $('#sheet').hidden = true;
    document.body.classList.remove('locked');
    $('#sheet-body').replaceChildren();
    $('#sheet-foot').replaceChildren();
    if (this.lastFocus && document.contains(this.lastFocus)) this.lastFocus.focus({ preventScroll: true });
  },
  saveScroll() { if (this.top) this.top.scroll = $('#sheet-body').scrollTop; },
  paint(fresh) {
    const v = this.top;
    const body = $('#sheet-body'), foot = $('#sheet-foot');
    $('#sheet-title').textContent = v.title;
    $('#sheet-back').hidden = this.stack.length < 2;
    body.replaceChildren();
    foot.replaceChildren();
    v.render(body, foot);
    body.scrollTop = fresh ? 0 : (v.scroll || 0);
    const target = fresh && v.autofocus ? v.autofocus() : null;
    if (target) target.focus();
    else if (fresh) $('.sheet').focus({ preventScroll: true });
  },
};

function onKey(e) {
  if (Sheet.isOpen) {
    if (e.key === 'Escape') { e.preventDefault(); Sheet.back(); return; }
    if (e.key === 'Tab') {
      const nodes = [...$('.sheet').querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select, textarea, summary')]
        .filter(n => n.offsetParent !== null && !n.closest('[hidden]'));
      if (!nodes.length) return;
      const first = nodes[0], last = nodes[nodes.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === $('.sheet'))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '') && S.items.length) {
    e.preventDefault();
    $('#filter-q').focus();
  }
}

let toastTimer;
function toast(msg, opts = {}) {
  const el = $('#toast');
  el.replaceChildren(h('span', null, msg));
  if (opts.action) {
    el.append(h('button', { type: 'button', onclick: () => { el.hidden = true; clearTimeout(toastTimer); opts.onAction(); } }, opts.action));
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, opts.duration || 3400);
}

function selwrap(select) { return h('span', { class: 'selwrap' }, select, icon('chevron', 16)); }
function segmented(options, current, onPick) {
  const wrap = h('div', { class: 'segtext', role: 'group' });

}
function chipsRow(options, current, onPick, ariaLabel) {

  for (const [val, label, ic] of options) {
    const b = h('button', { type: 'button', class: 'chip', 'aria-pressed': String(val === current), onclick: () => { paint(val); onPick(val); } }, ic ? icon(ic, 16) : null, label);

function sugField(draft, { id, label, key, placeholder, sugs, onInput }) {
  const ph = () => (typeof placeholder === 'function' ? placeholder() : placeholder);
  const input = h('input', { class: 'inp', id, value: draft[key] || '', placeholder: ph(), autocomplete: 'off' });
  const box = h('div', { class: 'sugs' });

function searchView() {
  const st = {
    q: '', type: store.get('stype') === 'release' ? 'release' : 'master', format: '',
    results: [], page: 0, pages: 0, total: 0, loading: false, loadingText: '', error: null, searched: false, lastQ: '', kind: 'text', ctl: null,
  };
  const v = { title: 'Adicionar digitalização' };
  let input, statusEl, resultsEl, moreBtn, formatRow;

  v.autofocus = () => input;
  v.render = (body, foot) => {
    if (!DG.token) body.append(tokenCard(() => Sheet.rerender()));
    input = h('input', { class: 'inp', type: 'search', id: 'dg-q', value: st.q, placeholder: 'Álbum, artista, código de barras ou link', enterkeyhint: 'search', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false' });
    input.addEventListener('input', () => { st.q = input.value; autoSearch(); });
    const form = h('form', { class: 'searchform', role: 'search', onsubmit: e => { e.preventDefault(); input.blur(); go(true); } },
      h('label', { class: 'searchbox', for: 'dg-q' }, h('span', { class: 'sr-only' }, 'Buscar no Discogs'), icon('search', 18), input),
      h('button', { class: 'btn btn-primary', type: 'submit' }, 'Buscar'));
    const seg = segmented([['master', 'Álbuns'], ['release', 'Edições']], st.type, val => {
      st.type = val; store.set('stype', val); formatRow.hidden = val !== 'release';
      if (st.q.trim()) go(true);
    });
    formatRow = chipsRow([['', 'Qualquer formato'], ...MEDIA.filter(m => m.dg).map(m => [m.id, m.label, m.icon])], st.format, val => { st.format = val; if (st.q.trim()) go(true); }, 'Formato');
    formatRow.hidden = st.type !== 'release';
    statusEl = h('div', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    resultsEl = h('div', { class: 'results' });
    moreBtn = h('button', { class: 'btn btn-block', type: 'button', hidden: true, onclick: () => go(false) }, 'Mais resultados');
    body.append(form, seg, formatRow,
      h('p', { class: 'hint' }, 'Álbuns reúne todas as versões de um disco; Edições mostra cada prensagem, com país, selo e nº de catálogo.'),
      statusEl, resultsEl, moreBtn,
      h('p', { class: 'credit' }, 'Dados fornecidos pelo ', h('a', { href: 'https://www.discogs.com', target: '_blank', rel: 'noopener' }, 'Discogs'), '.'));
    foot.append(h('button', { class: 'btn btn-block', type: 'button', onclick: () => Sheet.push(formView(blankDraft(), 'new')) }, icon('plus', 18), 'Adicionar sem o Discogs'));
    paint();
  };

  const autoSearch = debounce(() => {
    const p = parseQuery(st.q);
    if (p.kind === 'url') go(true);
    else if (p.kind === 'barcode' ? (p.value.length === 12 || p.value.length === 13) : st.q.trim().length >= 3) go(true);
  }, 650);

  async function go(reset) {
    const q = st.q.trim();
    if (!q) return;
    const p = parseQuery(q);
    if (p.kind === 'url') return openFromUrl(p);
    if (!DG.token) { st.error = { code: 'notoken' }; st.results = []; st.searched = false; paint(); return; }
    if (st.ctl) st.ctl.abort();
    const ctl = st.ctl = new AbortController();
    if (reset) { st.page = 0; st.pages = 0; st.total = 0; st.results = []; }
    st.loading = true; st.loadingText = 'Buscando no Discogs…'; st.error = null;
    paint();
    const params = p.kind === 'barcode'
      ? { barcode: p.value, type: 'release' }
      : { q, type: st.type, format: st.type === 'release' ? ((MEDIUM[st.format] || {}).dg || '') : '' };
    try {
      const data = await DG.search({ ...params, per_page: 25, page: st.page + 1 }, ctl.signal);
      if (ctl !== st.ctl) return;
      const pg = data.pagination || {};
      st.page = pg.page || st.page + 1;
      st.pages = pg.pages || 1;
      st.total = pg.items != null ? pg.items : (data.results || []).length;
      st.results = st.results.concat((data.results || []).filter(r => r.type === 'release' || r.type === 'master').map(normResult));
      st.searched = true; st.lastQ = q; st.kind = p.kind;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      if (ctl === st.ctl) st.error = e;
    } finally {
      if (ctl === st.ctl) { st.loading = false; paint(); }
    }
  }

  async function openFromUrl(p) {
    if (st.ctl) st.ctl.abort();
    const ctl = st.ctl = new AbortController();
    st.loading = true; st.loadingText = 'Abrindo o link do Discogs…'; st.error = null;
    paint();
    try {
      const info = p.type === 'release' ? await DG.release(p.id) : await DG.master(p.id);
      if (ctl !== st.ctl) return;
      st.loading = false;
      paint();
      const d = blankDraft();
      Object.assign(d, {
        title: info.title, artist: info.artist, year: info.year, country: info.country || '', label: info.label || '',
        catno: info.catno || '', formatText: info.formatText || '', thumb: info.thumb, cover: info.cover,
        medium: info.medium || '', mediumDetail: info.mediumDetail || '', discogs: info.discogs,
      });
      Sheet.push(formView(d, 'new'));
    } catch (e) {
      if (ctl === st.ctl) { st.loading = false; st.error = e; paint(); }
    }
  }

  function pick(r) {
    const d = blankDraft();
    Object.assign(d, {
      title: r.title, artist: r.artist, year: r.year, thumb: r.thumb, cover: r.cover,
      country: r.type === 'release' ? r.country : '', label: r.type === 'release' ? r.label : '',
      catno: r.type === 'release' ? r.catno : '', formatText: r.type === 'release' ? r.formatText : '',
      discogs: { type: r.type, releaseId: r.type === 'release' ? r.id : null, masterId: r.masterId, url: r.url },
    });
    if (r.type === 'release' && r.medium) { d.medium = r.medium; d.mediumDetail = r.detail; }
    const fv = formView(d, 'new');
    Sheet.push(fv);
    enrichDraft(d, fv);
  }

  function resultRow(r) {
    const exact = r.type === 'release' ? ownedFor(r.id, null, null).length > 0 : ownedFor(null, r.masterId, null).length > 0;
    const sameAlbum = !exact && r.type === 'release' && r.masterId && ownedFor(null, r.masterId, null).length > 0;
    const meta1 = [r.year, r.country, r.type === 'master' ? 'Álbum · todas as versões' : r.formatText].filter(Boolean).join(' · ');
    const meta2 = r.type === 'release' ? [r.label, r.catno].filter(Boolean).join(' · ') : '';
    return h('button', { class: 'res', type: 'button', onclick: () => pick(r) },
      coverEl({ title: r.title, artist: r.artist, thumb: r.thumb, cover: r.cover, medium: r.medium }, 'thumb'),
      h('span', { class: 'res-main' },
        h('span', { class: 'res-t' }, r.title || 'Sem título'),
        r.artist ? h('span', { class: 'res-a' }, r.artist) : null,
        meta1 ? h('span', { class: 'res-m' }, meta1) : null,
        meta2 ? h('span', { class: 'res-m' }, meta2) : null),
      exact ? h('span', { class: 'owned' }, icon('check', 12), 'No acervo')
        : sameAlbum ? h('span', { class: 'owned soft', title: 'Outra edição deste álbum já está no acervo' }, 'Álbum no acervo')
        : h('span', { class: 'res-go' }, icon('next', 18)));
  }

  function paint() {
    if (!statusEl) return;
    statusEl.className = 'status-line';
    statusEl.replaceChildren();
    resultsEl.replaceChildren(...st.results.map(resultRow));
    moreBtn.hidden = !(st.results.length && st.page < st.pages);
    moreBtn.disabled = st.loading;
    moreBtn.textContent = st.loading && st.results.length ? 'Carregando…' : 'Mais resultados';
    if (st.loading && !st.results.length) { statusEl.append(...spinnerLine(st.loadingText)); return; }
    if (st.error) {
      statusEl.className = 'status-line error';
      statusEl.append(errText(st.error));
      return;
    }
    if (!st.searched) return;
    if (!st.results.length) {
      statusEl.append(st.kind === 'barcode' ? `Nenhuma edição com o código de barras ${st.lastQ}.` : `Nada encontrado para “${st.lastQ}”.`);
      if (st.type === 'master' && st.kind === 'text') {
        statusEl.append(h('button', { class: 'linkbtn', type: 'button', onclick: () => { st.type = 'release'; store.set('stype', 'release'); Sheet.rerender(); go(true); } }, 'Buscar em Edições'));
      }
      return;
    }
    statusEl.append(`${fmtN(st.results.length)} de ${fmtN(st.total)} ${plural(st.total, 'resultado', 'resultados')}`);
    if (DG.degraded) statusEl.append(h('span', { class: 'degraded' }, ' · busca sem token: o Discogs não aceitou o token salvo, então não há capas. Gere um novo em Ajustes.'));
  }

  return v;
}

/* Completa os dados do álbum com a ficha completa do Discogs, sem sobrescrever o que o usuário editou. */
async function enrichDraft(draft, view) {
  const ticket = (draft._ticket = (draft._ticket || 0) + 1);
  const keys = ['title', 'artist', 'year', 'country', 'label', 'catno', 'formatText', 'thumb', 'cover'];
  const snap = Object.fromEntries(keys.map(k => [k, draft[k]]));
  const snapMedium = draft.medium, snapDetail = draft.mediumDetail;
  let info;
  try {
    if (draft.discogs.releaseId) info = await DG.release(draft.discogs.releaseId);
    else if (draft.discogs.masterId) info = await DG.master(draft.discogs.masterId);
    else return;
  } catch (e) { return; }
  if (draft._ticket !== ticket) return;
  for (const k of keys) {
    if (info[k] != null && info[k] !== '' && draft[k] === snap[k]) draft[k] = info[k];
  }
  draft.discogs = { ...draft.discogs, masterId: draft.discogs.masterId || info.discogs.masterId || null, url: info.discogs.url || draft.discogs.url };
  if (info.medium && !draft.medium) draft.medium = info.medium;
  // o detalhe deduzido da busca (ex.: "LP") vira o completo da ficha (ex.: 'LP 12" 33⅓ RPM'), se ninguém mexeu nele
  if (info.mediumDetail && info.medium === draft.medium && draft.mediumDetail === snapDetail && (!snapDetail || snapMedium === draft.medium)) {
    draft.mediumDetail = info.mediumDetail;
  }
  if (view && view.refresh) view.refresh();
}

      h('div', { class: 'two' }, field('a-label', 'Selo', 'label'), field('a-catno', 'Nº de catálogo', 'catno', { autocapitalize: 'characters' })),
      field('a-format', 'Formato no Discogs', 'formatText')));
  return {
    el: det,
    manual,
    showTitleError() { det.open = true; titleErr.hidden = false; inputs.title.focus(); },

        if (document.activeElement !== inp) inp.value = draft[k] == null ? '' : draft[k];
      }
    },
  };
}

function formView(draft, mode) {
  const v = { title: mode === 'edit' ? 'Editar digitalização' : 'Nova digitalização', dirty: false };

  v.refresh = () => {

    parts.medInputs.forEach(inp => { inp.checked = inp.value === draft.medium; });

        draft.status = val; touch();

      }, 'status st-' + s.id))));
    const dateField = h('div', { class: 'field' },

        h('button', { class: 'btn', type: 'button', onclick: () => { draft.date = todayISO(); dateInp.value = draft.date; touch(); } }, 'Hoje')));

    parts.fmt = sugField(draft, {

      placeholder: () => ((MEDIUM[draft.medium] || {}).formats || ['FLAC 24-bit/96 kHz'])[0],
      sugs: () => uniq([...history('fileFormat', draft.medium), ...((MEDIUM[draft.medium] || {}).formats || [])]),

      if (!String(draft.title || '').trim()) { parts.album.showTitleError(); return false; }
      if (!draft.medium) { medErr.hidden = false; medField.scrollIntoView({ block: 'center', behavior: 'smooth' }); return false; }
      return true;
    }
  };
  return v;
}

async function saveDraft(draft) {
  const now = new Date().toISOString();
  const item = normalizeItem({ ...draft, id: draft.id || uid(), createdAt: draft.createdAt || now, updatedAt: now });
  await DB.put(item);
  const i = S.items.findIndex(x => x.id === item.id);
  if (i >= 0) S.items[i] = item; else S.items.push(item);
  draft.id = item.id;
  draft.createdAt = item.createdAt;
  render();
  ensurePersist();
  return item;
}

async function duplicate(draft, validate) {
  if (!validate()) return;
  await saveDraft(draft);
  const d = blankDraft();
  for (const k of ['title', 'artist', 'year', 'country', 'label', 'catno', 'formatText', 'thumb', 'cover']) d[k] = draft[k];
  d.discogs = { ...draft.discogs };
  d.status = 'fila';
  Sheet.replace(formView(d, 'new'));
  toast('Original salvo. Agora escolha a outra mídia.');
}

async function removeItem(id) {
  const it = S.items.find(x => x.id === id);
  if (!it) { Sheet.close(); return; }
  await DB.del(id);
  S.items = S.items.filter(x => x.id !== id);
  render();
  Sheet.close();
  toast('Digitalização excluída', {
    action: 'Desfazer', duration: 7000,
    onAction: async () => { await DB.put(it); S.items.push(it); render(); toast('Digitalização restaurada'); },
  });
}

function openEdit(id) {
  const it = S.items.find(x => x.id === id);
  if (it) Sheet.show(formView(clone(it), 'edit'));
}

/* ================= Tela: escolher prensagem ================= */
function versionsView(draft, formV) {
  const st = { format: (MEDIUM[draft.medium] || {}).dg ? draft.medium : '', country: '', list: [], page: 0, pages: 0, total: 0, loading: false, error: null, countries: null, ctl: null };
  const v = { title: 'Escolher prensagem' };
  let statusEl, listEl, moreBtn, countrySel;

  v.render = body => {
    countrySel = h('select', { class: 'inp', id: 'ver-country', onchange: () => { st.country = countrySel.value; load(true); } });
    statusEl = h('div', { class: 'status-line', role: 'status', 'aria-live': 'polite' });
    listEl = h('div', { class: 'results' });
    moreBtn = h('button', { class: 'btn btn-block', type: 'button', hidden: true, onclick: () => load(false) }, 'Mais edições');
    body.append(
      h('p', { class: 'hint' }, h('strong', null, draft.title || 'Álbum'), draft.artist ? ` · ${draft.artist}` : ''),
      chipsRow([['', 'Todos os formatos'], ...MEDIA.filter(m => m.dg).map(m => [m.id, m.label, m.icon])], st.format, val => { st.format = val; st.country = ''; st.countries = null; load(true); }, 'Formato'),
      h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'ver-country' }, 'País'), selwrap(countrySel)),
      statusEl, listEl, moreBtn);
    paint();
    if (!st.page && !st.loading && !st.error) load(true);
  };

  function facetCountries(data) {
    const ff = (Array.isArray(data.filter_facets) ? data.filter_facets : []).find(f => f.id === 'country');
    if (ff && Array.isArray(ff.values)) return ff.values.map(x => ({ value: x.value, label: x.title || x.value, count: x.count }));
    const av = data.filters && data.filters.available && data.filters.available.country;
    if (av && typeof av === 'object') return Object.entries(av).map(([k, c]) => ({ value: k, label: k, count: c }));
    return null;
  }

  async function load(reset) {
    if (st.ctl) st.ctl.abort();
    const ctl = st.ctl = new AbortController();
    if (reset) { st.page = 0; st.pages = 0; st.list = []; }
    st.loading = true; st.error = null;
    paint();
    try {
      const data = await DG.versions(draft.discogs.masterId, { page: st.page + 1, format: (MEDIUM[st.format] || {}).dg || '', country: st.country }, ctl.signal);
      if (ctl !== st.ctl) return;
      const pg = data.pagination || {};
      st.page = pg.page || st.page + 1;
      st.pages = pg.pages || 1;
      st.total = pg.items != null ? pg.items : st.list.length;
      st.list = st.list.concat(Array.isArray(data.versions) ? data.versions : []);
      if (!st.country) st.countries = facetCountries(data) || st.countries;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      if (ctl === st.ctl) st.error = e;
    } finally {
      if (ctl === st.ctl) { st.loading = false; paint(); }
    }
  }

  function paintCountries() {
    let opts = st.countries;
    if (!opts) {
      const c = {};
      st.list.forEach(x => { if (x.country) c[x.country] = (c[x.country] || 0) + 1; });
      opts = Object.entries(c).map(([k, n]) => ({ value: k, label: k, count: n }));
    }
    opts = opts.slice().sort((a, b) => (b.count || 0) - (a.count || 0) || collator.compare(a.label, b.label));
    countrySel.replaceChildren(
      h('option', { value: '' }, 'Todos os países'),
      ...opts.map(o => h('option', { value: o.value, selected: o.value === st.country || null }, o.count ? `${o.label} (${fmtN(o.count)})` : o.label)));
    if (st.country && !opts.some(o => o.value === st.country)) countrySel.append(h('option', { value: st.country, selected: true }, st.country));
  }

  function verRow(ver) {
    const own = ownedFor(ver.id, null, draft.id).length > 0;
    const fmt = [...(ver.major_formats || []), ver.format].filter(Boolean).join(', ');
    const labelLine = [cleanName(ver.label), ver.catno && String(ver.catno).toLowerCase() !== 'none' ? ver.catno : ''].filter(Boolean).join(' · ');
    const place = [ver.country, ver.released].filter(Boolean).join(' · ');
    const inf = fromFormatList([...(ver.major_formats || []), ...String(ver.format || '').split(',')]);
    return h('button', { class: 'res', type: 'button', onclick: () => pick(ver) },
      coverEl({ title: draft.title, artist: draft.artist, thumb: goodImg(ver.thumb), medium: inf.medium || draft.medium }, 'thumb'),
      h('span', { class: 'res-main' },
        h('span', { class: 'res-t' }, fmt || ver.title || 'Edição'),
        labelLine ? h('span', { class: 'res-m' }, labelLine) : null,
        place ? h('span', { class: 'res-m' }, place) : null),
      own ? h('span', { class: 'owned' }, icon('check', 12), 'No acervo') : h('span', { class: 'res-go' }, icon('next', 18)));
  }

  function pick(ver) {
    draft.discogs = { type: 'release', releaseId: ver.id, masterId: draft.discogs.masterId, url: `https://www.discogs.com/release/${ver.id}` };
    draft.label = cleanName(ver.label || '');
    draft.catno = ver.catno && String(ver.catno).toLowerCase() !== 'none' ? String(ver.catno) : '';
    draft.country = ver.country || '';
    const y = parseInt(ver.released, 10);
    if (y) draft.year = y;
    draft.formatText = [...(ver.major_formats || []), ver.format].filter(Boolean).join(', ');
    if (goodImg(ver.thumb)) draft.thumb = ver.thumb;
    const inf = fromFormatList([...(ver.major_formats || []), ...String(ver.format || '').split(',')]);
    if (!draft.medium && inf.medium) draft.medium = inf.medium;
    if (!draft.mediumDetail && inf.medium && inf.medium === draft.medium) draft.mediumDetail = inf.detail;
    formV.dirty = true;
    Sheet.back();
    enrichDraft(draft, formV);
  }

  function paint() {
    if (!statusEl) return;
    paintCountries();
    statusEl.className = 'status-line';
    statusEl.replaceChildren();
    listEl.replaceChildren(...st.list.map(verRow));
    moreBtn.hidden = !(st.list.length && st.page < st.pages);
    moreBtn.disabled = st.loading;
    moreBtn.textContent = st.loading && st.list.length ? 'Carregando…' : 'Mais edições';
    if (st.loading && !st.list.length) { statusEl.append(...spinnerLine('Carregando edições do Discogs…')); return; }
    if (st.error) { statusEl.className = 'status-line error'; statusEl.append(errText(st.error)); return; }
    if (!st.list.length) { statusEl.append('Nenhuma edição com esses filtros.'); return; }
    statusEl.append(`${fmtN(st.list.length)} de ${fmtN(st.total)} ${plural(st.total, 'edição', 'edições')}`);
  }

  return v;
}

async function ensurePersist() {
  try {
    if (navigator.storage && navigator.storage.persisted && !(await navigator.storage.persisted())) await navigator.storage.persist();
  } catch (e) { /* sem suporte */ }
}

async function saveFile(blob, name) {
  if (isIOS() && navigator.canShare && typeof File === 'function') {
    try {
      const file = new File([blob], name, { type: blob.type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name, hidden: true });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return true;
}

function byCreated(a, b) { return (a.createdAt || '').localeCompare(b.createdAt || ''); }

async function exportJSON() {
  const items = S.items.slice().sort(byCreated);
  const data = { app: 'acervo', schema: 1, version: VERSION, exportedAt: new Date().toISOString(), count: items.length, items };
  const ok = await saveFile(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `acervo-backup-${todayISO()}.json`);
  if (ok) { store.set('last_export', new Date().toISOString()); toast('Backup exportado'); renderNudge(); }
}

function exportCSV() {
  const cols = [
    ['Artista', it => it.artist], ['Título', it => it.title], ['Ano', it => it.year || ''], ['País', it => it.country],
    ['Selo', it => it.label], ['Nº de catálogo', it => it.catno], ['Formato no Discogs', it => it.formatText],
    ['Mídia', it => (MEDIUM[it.medium] || MEDIUM.outro).label], ['Detalhe da mídia', it => it.mediumDetail],
    ['Status', it => statusLabel(it.status)], ['Data da digitalização', it => fmtDate(it.date)],
    ['Formato do arquivo', it => it.fileFormat], ['Equipamento', it => it.equipment], ['Estado da mídia', it => it.grade],
    ['Onde está o arquivo', it => it.location], ['Notas', it => it.notes], ['Link do Discogs', it => it.discogs.url],
    ['Release ID', it => it.discogs.releaseId || ''], ['Master ID', it => it.discogs.masterId || ''],
    ['Criado em', it => it.createdAt], ['Atualizado em', it => it.updatedAt],
  ];
  const esc = val => {
    let s = val == null ? '' : String(val);
    if (/^[=+@]/.test(s)) s = "'" + s;
    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const items = S.items.slice().sort((a, b) => collator.compare(a.artist, b.artist) || collator.compare(a.title, b.title));
  const lines = [cols.map(c => c[0]).join(';'), ...items.map(it => cols.map(c => esc(c[1](it))).join(';'))];
  saveFile(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }), `acervo-${todayISO()}.csv`).then(ok => { if (ok) toast('Planilha exportada'); });
}

async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Esse arquivo não é um backup do Acervo (não consegui ler o JSON).'); return; }
  const arr = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
  if (!arr) { toast('Esse arquivo não tem itens do Acervo.'); return; }
  const map = new Map(S.items.map(i => [i.id, i]));
  const toPut = [];
  let added = 0, updated = 0, kept = 0;
  for (const raw of arr) {
    if (!raw || typeof raw !== 'object') continue;
    const it = normalizeItem(raw);
    if (!it.title) continue;
    const cur = map.get(it.id);
    if (!cur) { added++; toPut.push(it); map.set(it.id, it); }
    else if ((it.updatedAt || '') > (cur.updatedAt || '')) { updated++; toPut.push(it); map.set(it.id, it); }
    else kept++;
  }
  try { await DB.putMany(toPut); } catch (e) { toast('Não deu para gravar a importação neste navegador.'); return; }
  S.items = [...map.values()];
  render();
  ensurePersist();
  toast(`Importação: ${fmtN(added)} ${plural(added, 'novo', 'novos')}, ${fmtN(updated)} ${plural(updated, 'atualizado', 'atualizados')}${kept ? `, ${fmtN(kept)} já em dia` : ''}.`, { duration: 6000 });
}

/* ================= Início ================= */
function openAdd() { Sheet.show(searchView()); }
function openSettings() { Sheet.show(settingsView()); }
function setView(view) {
  S.view = view;
  store.set('view', view);
  $('#view-list').setAttribute('aria-pressed', String(view === 'list'));
  $('#view-grid').setAttribute('aria-pressed', String(view === 'grid'));
  render();
}

async function init() {
  $('#btn-settings').addEventListener('click', openSettings);
  $('#fab').addEventListener('click', openAdd);
  const fq = $('#filter-q');
  fq.addEventListener('input', debounce(() => { S.q = fq.value; render(); }, 120));
  const sortSel = $('#sort');
  sortSel.value = S.sort;
  if (sortSel.value !== S.sort) { S.sort = 'recent'; sortSel.value = 'recent'; }
  sortSel.addEventListener('change', () => { S.sort = sortSel.value; store.set('sort', S.sort); render(); });
  $('#view-list').addEventListener('click', () => setView('list'));
  $('#view-grid').addEventListener('click', () => setView('grid'));
  $('#view-list').setAttribute('aria-pressed', String(S.view === 'list'));
  $('#view-grid').setAttribute('aria-pressed', String(S.view === 'grid'));
  $('#clear-filters').addEventListener('click', () => { S.q = ''; fq.value = ''; S.medium = ''; S.status = ''; render(); });
  $('#sheet-close').addEventListener('click', () => Sheet.requestClose());
  $('#sheet-back').addEventListener('click', () => Sheet.back());
  document.addEventListener('keydown', onKey);

  await DB.open();
  $('#storage-warn').hidden = !DB.mem;
  try {
    S.items = (await DB.all()).map(normalizeItem);
  } catch (e) {
    S.items = [];
  }
  render();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline indisponível */ });
  }
}

init();
})();
</script>
